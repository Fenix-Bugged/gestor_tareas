<header>
  <div class="logo-container" (click)="onLogoClick()" style="cursor: pointer;">
    <img src="img/listado-logo.png" alt="Lista de Tareas">
    <div>
      <h1>TAREA FACIL</h1>
      <p>Administrador de Tareas ADSO</p>
    </div>
  </div>
  
  <div class="header-actions" style="display: flex; gap: 1rem;">
    @if (authService.isLoggedIn()) {
      <button class="auth-btn btn-gestor-usuarios" (click)="onGestorUsuariosAction()" style="background: rgba(147, 0, 181, 0.25); border-color: #9300B5;">
        👤 Gestión Usuarios
      </button>
      <button class="auth-btn btn-gestor" (click)="onGestorAction()" style="background: rgba(160, 100, 255, 0.2); border-color: #a78bfa;">
        ⚙️ Gestión Admins
      </button>
    }
    <button class="auth-btn" (click)="onAuthAction()">
      @if (authService.isLoggedIn()) {
        🚪 Cerrar sesión
      } @else {
        🔒 Admin
      }
    </button>
  </div>
</header>
