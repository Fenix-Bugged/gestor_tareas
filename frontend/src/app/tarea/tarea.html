<!-- Edit overlay + modal (solo se abre si isAdmin y editando es true) -->
@if (editando() && isAdmin()) {
  <div class="modal-overlay" (click)="alCancelarEdicion()"></div>
  <dialog open class="edit-dialog">
    <h3>Editar Tarea</h3>
    <form (ngSubmit)="alGuardarEdicion()">
      <p>
        <label for="edit-titulo">Título</label>
        <input
          type="text"
          id="edit-titulo"
          name="edit-titulo"
          [value]="tituloEditado()"
          (input)="tituloEditado.set($any($event.target).value)"
          required
        />
      </p>
      <p>
        <label for="edit-descripcion">Descripción</label>
        <textarea
          id="edit-descripcion"
          name="edit-descripcion"
          rows="4"
          [value]="descripcionEditada()"
          (input)="descripcionEditada.set($any($event.target).value)"
        ></textarea>
      </p>
      <p>
        <label for="edit-fecha">Fecha Límite</label>
        <input
          type="date"
          id="edit-fecha"
          name="edit-fecha"
          [value]="fechaEditada()"
          (input)="fechaEditada.set($any($event.target).value)"
        />
      </p>
      <p class="modal-actions">
        <button type="button" class="btn-cancel" (click)="alCancelarEdicion()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="!tituloEditado().trim()">Guardar</button>
      </p>
    </form>
  </dialog>
}

<!-- Tarjeta de tarea -->
<div class="tarea" [ngClass]="{ 'completada': tarea().estado === 'completada' }">
  <article>
    <h2>{{ tarea().titulo }}</h2>
    @if (tarea().fechaLimite) {
      <time>📅 {{ tarea().fechaLimite }}</time>
    }
    <p>{{ tarea().descripcion }}</p>
    
    @if (isAdmin()) {
      <p class="actions">
        <button
          class="btn-terminar"
          [disabled]="tarea().estado === 'completada'"
          (click)="alCompletarTarea()">
          ✔ Terminar
        </button>
        <button
          class="btn-editar"
          [disabled]="tarea().estado === 'completada'"
          (click)="alEditarTarea()">
          ✏ Editar
        </button>
        <button
          class="btn-borrar"
          (click)="alBorrarTarea()">
          🗑 Borrar
        </button>
      </p>
    }
  </article>
</div>
